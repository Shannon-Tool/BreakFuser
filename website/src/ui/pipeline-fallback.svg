<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">BreakFuser end-to-end pipeline schematic</title>
  <desc id="desc">Request and ResponseContract feed three parallel acquisition branches. Their evidence joins on the blackboard, then the uncensored response model composes and verifies a ChatCompletion.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e4e1d8" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#59666b"/></marker>
    <style>
      .node{fill:#fdfcf8;stroke:#7d898d;stroke-width:1.3}.knowledge{stroke:#315f7d}.response{stroke:#9b4c3f}.evidence{stroke:#456b59}.verify{stroke:#8b672b}
      .label{font:600 15px Arial,sans-serif;fill:#1d2428}.sub{font:11px monospace;fill:#687176}.small{font:11px Arial,sans-serif;fill:#687176}.section{font:700 11px monospace;letter-spacing:1.5px;fill:#315f7d}
      .flow{fill:none;stroke:#59666b;stroke-width:1.4;marker-end:url(#arrow)}.aux{fill:none;stroke:#9b4c3f;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="700" fill="#f5f3ec"/><rect width="1400" height="700" fill="url(#grid)"/>
  <text x="35" y="40" class="section">FIGURE 1 / END-TO-END RUNTIME FUSION</text>
  <text x="35" y="64" class="small">Arrows denote named data payloads. The three acquisition branches execute concurrently.</text>
  <path class="flow" d="M160 330H195"/><path class="flow" d="M335 305C365 275 355 150 390 150"/><path class="flow" d="M335 330H390"/><path class="flow" d="M335 355C365 385 355 510 390 510"/>
  <path class="flow" d="M545 150C600 150 620 285 680 305"/><path class="flow" d="M545 330H680"/><path class="flow" d="M545 510C600 510 620 375 680 355"/>
  <path class="flow" d="M825 330H890"/><path class="flow" d="M1035 330H1090"/><path class="flow" d="M1235 330H1260"/>
  <path class="aux" d="M270 365V630H960V370"/>
  <path class="aux" d="M465 285C430 225 500 205 520 265"/>
  <g transform="translate(30 290)"><rect class="node" width="130" height="80"/><text x="14" y="28" class="label">Request</text><text x="14" y="51" class="sub">messages[]</text></g>
  <g transform="translate(195 290)"><rect class="node knowledge" width="140" height="80"/><text x="14" y="28" class="label">Triage</text><text x="14" y="51" class="sub">ResponseContract</text></g>
  <g transform="translate(390 110)"><rect class="node knowledge" width="155" height="80"/><text x="14" y="28" class="label">Documents</text><text x="14" y="51" class="sub">SourceDocument[]</text></g>
  <g transform="translate(390 290)"><rect class="node knowledge" width="155" height="80"/><text x="14" y="28" class="label">Knowledge model</text><text x="14" y="51" class="sub">turn-01 / turn-02</text></g>
  <g transform="translate(390 470)"><rect class="node response" width="155" height="80"/><text x="14" y="28" class="label">Local draft</text><text x="14" y="51" class="sub">uncensored model</text></g>
  <g transform="translate(680 290)"><rect class="node evidence" width="145" height="80"/><text x="14" y="28" class="label">Blackboard</text><text x="14" y="51" class="sub">EvidenceSpan[]</text></g>
  <g transform="translate(890 290)"><rect class="node response" width="145" height="80"/><text x="14" y="28" class="label">Composition</text><text x="14" y="51" class="sub">targeted_synthesis</text></g>
  <g transform="translate(1090 290)"><rect class="node verify" width="145" height="80"/><text x="14" y="28" class="label">Verify after</text><text x="14" y="51" class="sub">claims + schema</text></g>
  <g transform="translate(1260 290)"><rect class="node evidence" width="120" height="80"/><text x="14" y="28" class="label">Response</text><text x="14" y="51" class="sub">ChatCompletion</text></g>
  <text x="385" y="86" class="small">parallel acquisition</text>
  <text x="405" y="260" class="small">quality recovery</text>
  <text x="570" y="653" class="small">original context + contract</text>
  <text x="35" y="680" class="small">Blue: knowledge acquisition · Vermilion: response model · Green: evidence/output · Ochre: verification</text>
</svg>
