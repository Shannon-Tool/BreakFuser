<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 980" role="img" aria-labelledby="title desc">
  <title id="title">BreakFuser vertical pipeline schematic</title>
  <desc id="desc">Request and triage feed document, knowledge-model, and local-draft branches. Evidence joins on the blackboard before uncensored composition, verification, and response.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#e4e1d8"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59666b"/></marker>
    <style>
      .node{fill:#fdfcf8;stroke:#315f7d;stroke-width:1.5}.response{stroke:#9b4c3f}.evidence{stroke:#456b59}.verify{stroke:#8b672b}
      .label{font:600 18px Arial,sans-serif;fill:#1d2428}.sub{font:13px monospace;fill:#687176}.small{font:13px Arial,sans-serif;fill:#687176}.section{font:700 13px monospace;letter-spacing:1.5px;fill:#315f7d}
      .flow{fill:none;stroke:#59666b;stroke-width:1.6;marker-end:url(#arrow)}.aux{fill:none;stroke:#9b4c3f;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="600" height="980" fill="#f5f3ec"/><rect width="600" height="980" fill="url(#grid)"/>
  <text x="300" y="32" text-anchor="middle" class="section">END-TO-END RUNTIME FUSION</text>
  <path class="flow" d="M300 102V140"/><path class="flow" d="M300 220V248H85V280"/><path class="flow" d="M300 220V280"/><path class="flow" d="M300 220V248H515V280"/>
  <path class="flow" d="M85 370V412H260V450"/><path class="flow" d="M300 370V450"/><path class="flow" d="M515 370V412H340V450"/>
  <path class="flow" d="M300 540V580"/><path class="flow" d="M300 670V710"/><path class="flow" d="M300 800V840"/>
  <path class="aux" d="M355 180H565V615H380"/>
  <g transform="translate(210 55)"><rect class="node" width="180" height="48"/><text x="90" y="21" text-anchor="middle" class="label">Request</text><text x="90" y="39" text-anchor="middle" class="sub">messages[]</text></g>
  <g transform="translate(210 140)"><rect class="node" width="180" height="80"/><text x="90" y="31" text-anchor="middle" class="label">Triage</text><text x="90" y="55" text-anchor="middle" class="sub">ResponseContract</text></g>
  <g transform="translate(5 280)"><rect class="node" width="160" height="90"/><text x="80" y="33" text-anchor="middle" class="label">Documents</text><text x="80" y="59" text-anchor="middle" class="sub">SourceDocument[]</text></g>
  <g transform="translate(220 280)"><rect class="node" width="160" height="90"/><text x="80" y="30" text-anchor="middle" class="label">Knowledge model</text><text x="80" y="56" text-anchor="middle" class="sub">turn-01 / turn-02</text><text x="80" y="76" text-anchor="middle" class="small">bounded recovery</text></g>
  <g transform="translate(435 280)"><rect class="node response" width="160" height="90"/><text x="80" y="33" text-anchor="middle" class="label">Local draft</text><text x="80" y="59" text-anchor="middle" class="sub">uncensored model</text></g>
  <text x="300" y="258" text-anchor="middle" class="small">three concurrent acquisition branches</text>
  <g transform="translate(210 450)"><rect class="node evidence" width="180" height="90"/><text x="90" y="33" text-anchor="middle" class="label">Blackboard</text><text x="90" y="59" text-anchor="middle" class="sub">EvidenceSpan[]</text></g>
  <g transform="translate(210 580)"><rect class="node response" width="180" height="90"/><text x="90" y="33" text-anchor="middle" class="label">Composition</text><text x="90" y="59" text-anchor="middle" class="sub">targeted_synthesis</text></g>
  <g transform="translate(210 710)"><rect class="node verify" width="180" height="90"/><text x="90" y="33" text-anchor="middle" class="label">Verify after</text><text x="90" y="59" text-anchor="middle" class="sub">claims + schema</text></g>
  <g transform="translate(210 840)"><rect class="node evidence" width="180" height="90"/><text x="90" y="33" text-anchor="middle" class="label">Response</text><text x="90" y="59" text-anchor="middle" class="sub">ChatCompletion</text></g>
  <text x="560" y="405" text-anchor="end" class="small">original context</text>
  <text x="560" y="423" text-anchor="end" class="small">+ contract</text>
  <text x="300" y="960" text-anchor="middle" class="small">Evidence and original context fused into one verified response</text>
</svg>
