name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project and development dependencies
        run: python -m pip install '.[dev]'
      - name: Check lint and formatting
        run: make lint
      - name: Run strict type checking
        run: make typecheck
      - name: Run standard tests and coverage gates
        run: make test
      - name: Run end-to-end tests
        run: make e2e
      - name: Run deterministic benchmarks
        run: make bench

  package:
    name: Build and verify package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: make package
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Verify public imports
        run: python -c "import breakfuser; import BreakFuser"
      - name: Run simple local-simulation example
        env:
          BREAKFUSER_MODE: mock
        run: python examples/simple_chat.py
