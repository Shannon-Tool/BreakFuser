<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">BreakFuser by SHANNON</title>
  <desc id="desc">The BreakFuser horizontal wordmark with a cyan, indigo, and mint fusion symbol and the tagline Uncensored model fusion.</desc>
  <defs>
    <linearGradient id="panel" x1="24" y1="24" x2="1176" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111A35"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D2850"/>
      <stop offset="1" stop-color="#11182E"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <symbol id="fusion" viewBox="0 0 160 160">
      <path d="M22 38H47C70 38 72 80 98 80" fill="none" stroke="#22D3EE" stroke-width="15" stroke-linecap="round"/>
      <path d="M22 122H47C70 122 72 80 98 80" fill="none" stroke="#6366F1" stroke-width="15" stroke-linecap="round"/>
      <path d="M98 80H138" fill="none" stroke="#34D399" stroke-width="15" stroke-linecap="round"/>
      <circle cx="22" cy="38" r="8" fill="#22D3EE"/>
      <circle cx="22" cy="122" r="8" fill="#6366F1"/>
      <circle cx="138" cy="80" r="8" fill="#34D399"/>
      <path d="M98 63L115 80L98 97L81 80Z" fill="#F8FAFC"/>
      <path d="M98 71L107 80L98 89L89 80Z" fill="url(#core)"/>
    </symbol>
  </defs>
  <rect x="24" y="24" width="1152" height="252" rx="48" fill="url(#panel)"/>
  <rect x="25" y="25" width="1150" height="250" rx="47" fill="none" stroke="#27334F"/>
  <rect x="58" y="54" width="192" height="192" rx="48" fill="url(#tile)" stroke="#334164"/>
  <use href="#fusion" x="74" y="70" width="160" height="160"/>
  <text x="292" y="145" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="750" letter-spacing="3">BREAKFUSER</text>
  <text x="296" y="194" fill="#A9B7CF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="500" letter-spacing="2.2">UNCENSORED MODEL FUSION</text>
  <text x="1112" y="235" text-anchor="end" fill="#7F90AD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650" letter-spacing="3">BY SHANNON</text>
</svg>
